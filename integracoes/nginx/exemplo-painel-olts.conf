# Exemplo: Painel das OLTs (monitoramento.updown.com.br:8443) usando o login
# único do portal no lugar do painel-auth. Compare com o site atual em
# /etc/nginx/sites-available/ antes de trocar — mude só as linhas de login.

server {
    listen 8443 ssl;
    server_name monitoramento.updown.com.br;
    ssl_certificate     /etc/letsencrypt/live/monitoramento.updown.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitoramento.updown.com.br/privkey.pem;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    root /var/www/painel-olt;
    index index.html;

    include /etc/nginx/snippets/portal-sso.conf;
    set $portal_sistema olts;

    # o antigo /login, /logout e /sessao do painel-auth passam a ser do portal
    location = /login  { return 302 https://portal.updown.com.br/login?sistema=olts&volta=https://$http_host/; }
    location = /logout { return 302 https://portal.updown.com.br/sso/sair; }

    location / {
        auth_request /_portal_auth;
        error_page 401 = @portal_login;
        error_page 403 = @portal_negado;
        try_files $uri $uri/ =404;
    }

    # API do Zabbix: só com sessão válida (o token continua só aqui)
    location = /zbx-api {
        auth_request /_portal_auth;
        proxy_pass https://zbx7.lv.network/api_jsonrpc.php;   # mantenha o destino atual
        proxy_ssl_server_name on;
        proxy_set_header Host zbx7.lv.network;
        proxy_set_header Authorization "Bearer __TOKEN__";
        proxy_set_header Cookie "";
        proxy_read_timeout 60s;
    }
}

