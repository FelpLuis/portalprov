# /etc/nginx/conf.d/portal-sso-cache.conf  (contexto http — uma vez por servidor)
# Guarda por 30 s a resposta do portal para cada sessão, para o nginx não
# perguntar ao portal a cada arquivo/requisição do painel.
proxy_cache_path /var/cache/nginx/portal-sso levels=1:2 keys_zone=portal_sso:2m max_size=20m inactive=5m use_temp_path=off;
