# Documentação (documentacao.noc.updown.com.br) no servidor .13 — mesmo servidor do portal.
# Troque só o bloco location / do site atual (/etc/nginx/sites-available/documentacao-noc)
# e desligue o login próprio da documentação: LOGIN=0 em /opt/documentacao-noc/config.env.

server {
    listen 443 ssl;
    server_name documentacao.noc.updown.com.br;
    ssl_certificate     /etc/letsencrypt/live/documentacao.noc.updown.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/documentacao.noc.updown.com.br/privkey.pem;

    include /etc/nginx/snippets/portal-sso-local.conf;
    set $portal_sistema documentacao;

    location / {
        auth_request /_portal_auth;
        auth_request_set $portal_user $upstream_http_x_portal_user;
        error_page 401 = @portal_login;
        error_page 403 = @portal_negado;
        proxy_pass http://127.0.0.1:8447;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Portal-User $portal_user;
    }
}
