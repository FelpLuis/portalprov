# /etc/nginx/snippets/portal-sso-local.conf
# Versão para sites no MESMO servidor do portal (servidor .13: documentação):
# consulta o portal direto em 127.0.0.1:8790, sem TLS e sem sair da máquina.
# Login único do Portal NOC para painéis atrás de nginx.
# Uso, dentro de cada server { } protegido:
#
#     include /etc/nginx/snippets/portal-sso.conf;
#     set $portal_sistema olts;          # identificador do sistema no portal
#
#     location / {
#         auth_request /_portal_auth;
#         error_page 401 = @portal_login;
#         error_page 403 = @portal_negado;
#         ...                            # root / proxy_pass atuais
#     }
#
# Portal: portal.updown.com.br
# Requer o módulo auth_request (nginx-full / nginx-extras) e o
# conf.d/portal-sso-cache.conf.

location = /_portal_auth {
    internal;
    proxy_pass http://127.0.0.1:8790/sso/verificar?sistema=$portal_sistema;
    proxy_set_header Host portal.updown.com.br;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;

    # cache curto por sessão + sistema (204 liberado / 403 sem permissão)
    proxy_cache portal_sso;
    proxy_cache_key "$portal_sistema|$cookie_updown_sso";
    proxy_cache_valid 204 403 30s;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
}

# Sem sessão: vai para o login do portal e volta para cá depois.
location @portal_login {
    return 302 https://portal.updown.com.br/login?sistema=$portal_sistema&volta=$scheme://$http_host$uri;
}

# Com sessão, mas sem permissão para este sistema.
location @portal_negado {
    return 302 https://portal.updown.com.br/?negado=$portal_sistema;
}
