<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#140075">
<title>UPDOWN NOC · Portal</title>
<link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script src="/js/theme.js"></script>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <a class="sidebar-logo" href="#/"><img src="/assets/brand/updown-logo.png" alt="UPDOWN"><span>NOC · PORTAL</span></a>
    <nav class="nav" id="nav" aria-label="Menu principal"></nav>
    <div class="sidebar-foot"><span class="dot"></span>Sistema online<small id="relogio"></small></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="btnMenu" type="button" aria-label="Abrir menu"></button>
      <button class="theme-btn" type="button" data-theme-toggle aria-label="Alternar tema"><svg class="ic-lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg><svg class="ic-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg></button>
      <span class="sep"></span>
      <button class="user-chip" id="btnConta" type="button" aria-haspopup="menu" aria-expanded="false">
        <span class="avatar" id="avatar"></span><span id="userName"></span>
      </button>
      <span class="sep"></span>
      <button class="sair" id="btnSair" type="button"></button>
      <div class="menu" id="menuConta" role="menu" hidden>
        <div class="menu-head"><strong id="menuNome"></strong><small id="menuLogin"></small></div>
        <button role="menuitem" type="button" id="btnSenha">Trocar minha senha</button>
      </div>
    </header>
    <main class="page" id="view" tabindex="-1"></main>
  </div>
</div>

<dialog id="dlgSenha" class="dialog">
  <form id="formSenha">
    <h2>Trocar minha senha</h2>
    <p>A nova senha passa a valer em todas as plataformas.</p>
    <label class="field"><span>Senha atual</span>
      <div class="pw"><input id="senhaAtual" type="password" autocomplete="current-password" required>
      <button type="button" class="pw-toggle" data-target="senhaAtual">Mostrar</button></div></label>
    <label class="field"><span>Nova senha <small class="muted">(mínimo 8 caracteres)</small></span>
      <div class="pw"><input id="senhaNova" type="password" autocomplete="new-password" minlength="8" required>
      <button type="button" class="pw-toggle" data-target="senhaNova">Mostrar</button></div></label>
    <label class="field"><span>Repita a nova senha</span>
      <input id="senhaNova2" type="password" autocomplete="new-password" minlength="8" required></label>
    <p class="form-error" id="senhaErro" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="btn btn-light" data-close>Cancelar</button>
      <button type="submit" class="btn btn-primary">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="dlgConfirma" class="dialog">
  <form method="dialog">
    <h2 id="confTitulo"></h2>
    <p id="confTexto"></p>
    <div class="dialog-actions">
      <button value="nao" class="btn btn-light">Cancelar</button>
      <button value="sim" class="btn btn-danger" id="confOk">Excluir</button>
    </div>
  </form>
</dialog>

<script src="/js/common.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
